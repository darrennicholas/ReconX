name: ReconX CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reconx
          POSTGRES_PASSWORD: reconx
          POSTGRES_DB: reconx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconx -d reconx_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://reconx:reconx@127.0.0.1:5432/reconx_test?sslmode=disable
      RECONX_RBAC_TEST_DATABASE_URL: postgres://reconx:reconx@127.0.0.1:5432/reconx_test?sslmode=disable
      APP_ENV: development
      API_ADDR: 127.0.0.1:18080
      API_PROXY_TARGET: http://127.0.0.1:18080
      BOOTSTRAP_ADMIN_NAME: ReconX Admin
      BOOTSTRAP_ADMIN_EMAIL: admin@reconx.local
      BOOTSTRAP_ADMIN_PASSWORD: developer
      IMPORT_STORAGE_DIR: /tmp/reconx-ci-imports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend including PostgreSQL integration
        working-directory: backend
        run: go test ./... -count=1
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Seed isolated database and run browser tests
        shell: bash
        run: |
          cd backend
          go run ./cmd/migrate
          go run ./cmd/seed
          go run ./cmd/api > /tmp/reconx-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/v1/health >/dev/null
          cd ../frontend
          npm run test:e2e
      - name: Upload browser test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore
